6) შექმენით `span` ელემენტი და გაუწერეთ შუა ხაზი (`line-through`), `wavy` სტილით, `rgb(255, 0, 255)` ფერით და `5px` სისქით.

7) შექმენით `h4` ელემენტი და გაუწერეთ ზედა ხაზი (`overline`), `dashed` სტილით, `#00BFFF` ფერით და `4px` სისქით.

8) შექმენით `h5` ელემენტი და გამოიყენეთ `text-decoration: underline dotted brown 6px;`.
